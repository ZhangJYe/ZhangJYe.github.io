# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# ---------------------
# Navigation
# ---------------------
nav:
  logo: /images/avatar.png
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# ---------------------
# Social Links
# ---------------------
social:
  fab fa-github: https://github.com/ZhangJYe||Github

# ---------------------
# Index (Homepage)
# ---------------------
index_layout: 4
index_top_img_height: 480px
index_site_info_top: 52%

# Typing effect on homepage
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 55
    backSpeed: 28
    backDelay: 1800
    loop: true
  source: false
  sub:
    - Agent Engineering
    - AIOps / 智能运维
    - Go Backend
    - Research Notes
    - AI Coding

# ---------------------
# Page layout
# ---------------------
disable_top_img: false
default_top_img: false
index_img: /images/bg.jpg
footer_img: false
background: '#f6f2ea'

# ---------------------
# Avatar
# ---------------------
avatar:
  img: /images/avatar.png
  effect: false

# ---------------------
# Site icon
# ---------------------
favicon: /images/favicon.svg

# ---------------------
# Sidebar
# ---------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 武汉大学研究生｜AIOps + Agent｜Go Backend
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/ZhangJYe
  card_announcement:
    enable: true
    content: >
      这里记录我在 AIOps、Agent、Go 后端、RAG 和 AI Coding 方向的学习笔记与工程实践。
      文章以技术总结和论文阅读为主，不定期更新。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:

# ---------------------
# Table of Contents
# ---------------------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# ---------------------
# Code blocks
# ---------------------
highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_height_limit: 300
code_word_wrap: true

# ---------------------
# Article meta
# ---------------------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

# Article word count & reading time
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ---------------------
# Read mode
# ---------------------
readmode: true

# ---------------------
# Dark mode
# ---------------------
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ---------------------
# Footer
# ---------------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

# ---------------------
# Creative Commons
# ---------------------
creative_commons:
  post: true
  language: zh-CN
  license: by-nc-sa

# ---------------------
# Cover (disabled — text-focused design)
# ---------------------
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  position: both
  default_cover:

# ---------------------
# Tag plugins
# ---------------------
tag_plugins:
  enable: true

# ---------------------
# Search
# ---------------------
local_search:
  enable: true
  preload: false
  CDN:

# ---------------------
# Background effects (subtle)
# ---------------------
# Can add bubble/flock/click effects later if desired

# ---------------------
# Beautify / Effect
# ---------------------
beautify:
  enable: true
  field: post
  title-prefix-icon: "\f0c1"
  title-prefix-icon-color: "#F47466"

# ---------------------
# Busuanzi counter (visitor stats)
# ---------------------
busuanzi_site_uv: true
busuanzi_site_pv: true
busuanzi_page_pv: true

# ---------------------
# Anchor link
# ---------------------
anchor:
  auto_update: false
  click:
    scroll_decode: true

# ---------------------
# Inject custom CSS
# ---------------------
inject:
  head:
    - <link rel="preconnect" href="https://fonts.googleapis.com">
    - <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    - <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    - <link rel="stylesheet" href="/css/custom.css">
