# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/

# ---------------------
# Navigation
# ---------------------
nav:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# ---------------------
# Social Links
# ---------------------
social:
  fab fa-github: https://github.com/ZhangJYe||Github

# ---------------------
# Index (Homepage)
# ---------------------
index_layout: both

# Typing effect on homepage
description:
  enable: true
  typed:
    - AIOps & Agent 研究
    - Go 后端开发
    - 智能运维 & AI Coding
    - RAG 与工程化 Agent

# ---------------------
# Page layout
# ---------------------
disable_top_img: true

# ---------------------
# Avatar
# ---------------------
avatar:
  img: /images/avatar.png
  effect: true

# ---------------------
# Site icon
# ---------------------
favicon: /images/favicon.png

# ---------------------
# Sidebar
# ---------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 武汉大学研究生 | AIOps + Agent
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/ZhangJYe
  card_announcement:
    enable: true
    content: 欢迎来到 Fire 的个人笔记站点，记录 AIOps、Agent、Go 后端等方向的学习与实践。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:

# ---------------------
# Table of Contents
# ---------------------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# ---------------------
# Code blocks
# ---------------------
highlight_theme: mac
highlight_copy: true
highlight_lang: true
highlight_height_limit: 300
code_word_wrap: true

# ---------------------
# Article meta
# ---------------------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: relative
    categories: true
    tags: true
    label: true

# Article word count & reading time
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ---------------------
# Read mode
# ---------------------
readmode: true

# ---------------------
# Dark mode
# ---------------------
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ---------------------
# Footer
# ---------------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

# ---------------------
# Creative Commons
# ---------------------
creative_commons:
  post: true
  language: zh-CN
  license: by-nc-sa

# ---------------------
# Cover (disabled — text-focused design)
# ---------------------
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  position: both
  default_cover:

# ---------------------
# Tag plugins
# ---------------------
tag_plugins:
  enable: true

# ---------------------
# Search
# ---------------------
local_search:
  enable: true
  preload: false
  CDN:

# ---------------------
# Background effects (subtle)
# ---------------------
# Can add bubble/flock/click effects later if desired

# ---------------------
# Beautify / Effect
# ---------------------
beautify:
  enable: true
  field: post
  title-prefix-icon: "\f0c1"
  title-prefix-icon-color: "#F47466"

# ---------------------
# Busuanzi counter (visitor stats)
# ---------------------
busuanzi_site_uv: true
busuanzi_site_pv: true
busuanzi_page_pv: true

# ---------------------
# Anchor link
# ---------------------
anchor:
  auto_update: false
  click:
    scroll_decode: true
