<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Terminal bracket symbol -->
  <text x="100" y="125" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="72" font-weight="700" fill="#e2e8f0" opacity="0.9">&gt;_</text>
  <!-- Accent dot -->
  <circle cx="155" cy="78" r="8" fill="#533483" opacity="0.8"/>
  <!-- Subtle grid lines -->
  <line x1="20" y1="160" x2="180" y2="160" stroke="#533483" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="170" x2="140" y2="170" stroke="#0f3460" stroke-width="1" opacity="0.2"/>
</svg>
